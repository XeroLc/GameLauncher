name: Sync Release to Gitee & GitCode

# 1. 触发条件：当有新的 Release 发布时触发
on:
  release:
    types: [published]

jobs:
  sync-to-gitee-and-gitcode:
    runs-on: ubuntu-latest
    steps:
      # 2. 检出代码，fetch-depth: 0 确保获取所有历史记录和标签
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 3. 同步到 Gitee
      - name: Mirror to Gitee
        uses: Yikun/hub-mirror-action@master
        with:
          src: github/${{ github.repository_owner }}
          dst: gitee/${{ github.repository_owner }}
          dst_key: ${{ secrets.GITEE_PRIVATE_KEY }}
          dst_token: ${{ secrets.GITEE_TOKEN }}
          # static_list 指定只同步当前仓库，避免同步账号下所有仓库
          static_list: ${{ github.event.repository.name }}
          force_update: true

      # 4. 同步到 GitCode
      - name: Mirror to GitCode
        uses: Yikun/hub-mirror-action@master
        with:
          src: github/${{ github.repository_owner }}
          dst: gitcode/${{ github.repository_owner }}
          dst_key: ${{ secrets.GITCODE_PRIVATE_KEY }}
          dst_token: ${{ secrets.GITCODE_TOKEN }}
          static_list: ${{ github.event.repository.name }}
          force_update: true
